<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Procedural Jinx</title>
    <style>
      :root {
        --bg: #131315;
        --panel: #141416;
        --line: #232326;
        --line-soft: #1d1d20;
        --ink: #ececee;
        --ink-dim: #9a9aa3;
        --ink-mute: #6b6b74;
        --accent: #ff5f2e;
        --chip: #1a1a1d;
        --sans: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI",
          Roboto, "Helvetica Neue", Arial, sans-serif;
        --mono: ui-monospace, "SF Mono", "JetBrains Mono", "Cascadia Mono",
          Menlo, Consolas, "Liberation Mono", monospace;
        --panel-w: 480px;
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: var(--bg);
        color: var(--ink);
        font-family: var(--sans);
        -webkit-font-smoothing: antialiased;
        overflow: hidden;
      }

      /* ---------------------------------------------------------------- shell */

      #app { display: block; height: 100%; }

      #detail {
        position: fixed;
        inset: 0 auto 0 0;
        width: var(--panel-w);
        border-right: 1px solid var(--line);
        background: var(--panel);
        overflow-y: auto;
        overflow-x: hidden;
        padding: 22px 30px 40px;
        z-index: 3;
        scrollbar-width: thin;
        scrollbar-color: #2b2b30 transparent;
      }
      #detail::-webkit-scrollbar { width: 9px; }
      #detail::-webkit-scrollbar-thumb {
        background: #2b2b30;
        border-radius: 9px;
        border: 3px solid var(--panel);
      }

      #stage {
        position: fixed;
        inset: 0 0 0 var(--panel-w);
        z-index: 1;
      }
      #stage canvas { display: block; width: 100%; height: 100%; }

      /* ---------------------------------------------------------------- panel */

      .crumbs {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding-bottom: 22px;
        margin-bottom: 24px;
        border-bottom: 1px solid var(--line-soft);
      }
      .crumbs a {
        color: var(--ink-dim);
        text-decoration: none;
        font-size: 12.5px;
        letter-spacing: 0.01em;
        transition: color 0.15s ease;
      }
      .crumbs a:hover { color: var(--ink); }
      .crumbs .here {
        font-family: var(--mono);
        font-size: 10px;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: var(--ink-mute);
      }

      .eyebrow {
        font-family: var(--mono);
        font-size: 10.5px;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--accent);
        margin: 0 0 12px;
      }

      h1 {
        margin: 0 0 20px;
        font-size: 25px;
        line-height: 1.24;
        font-weight: 600;
        letter-spacing: -0.015em;
        color: #f4f4f2;
      }

      .byline { margin: 0 0 26px; }
      .byline .lead {
        display: block;
        font-size: 11px;
        color: var(--ink-mute);
        margin-bottom: 5px;
      }
      .byline .who {
        font-size: 13.5px;
        color: var(--ink);
        letter-spacing: 0.005em;
      }
      .byline .who span { color: var(--ink-mute); }

      .field-label {
        font-family: var(--mono);
        font-size: 9.5px;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: var(--ink-mute);
        margin: 0 0 10px;
      }

      .thumb {
        border: 1px solid var(--line);
        border-radius: 3px;
        background: #0d0d0f;
        padding: 10px;
        margin-bottom: 26px;
      }
      .thumb img {
        display: block;
        width: 100%;
        height: 300px;
        object-fit: contain;
        object-position: center;
        border-radius: 2px;
        background: #0a0a0c;
      }
      .thumb figcaption {
        margin-top: 10px;
        font-family: var(--mono);
        font-size: 10px;
        line-height: 1.5;
        color: #5c5c65;
        letter-spacing: 0.02em;
      }

      .tags {
        display: flex;
        flex-wrap: wrap;
        gap: 7px;
        margin-bottom: 24px;
        padding: 0;
        list-style: none;
      }
      .tags li {
        font-family: var(--mono);
        font-size: 10.5px;
        line-height: 1;
        letter-spacing: 0.04em;
        color: #b3b3bb;
        background: var(--chip);
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 6px 11px 7px;
        white-space: nowrap;
      }
      .tags li.wide { white-space: normal; }

      .blurb {
        margin: 0 0 14px;
        font-size: 13px;
        line-height: 1.72;
        color: var(--ink-dim);
      }
      .blurb strong { color: #cfcfd6; font-weight: 500; }

      /* ------------------------------------------------------------- controls */

      #controls {
        position: fixed;
        right: 20px;
        bottom: 20px;
        z-index: 4;
        width: 236px;
        padding: 13px 14px 14px;
        border: 1px solid #2a2a30;
        border-radius: 5px;
        background: rgba(16, 16, 19, 0.86);
        backdrop-filter: blur(9px);
        box-shadow: 0 12px 34px rgba(0, 0, 0, 0.45);
        font-family: var(--mono);
      }
      #controls .grp + .grp { margin-top: 12px; }
      #controls .grp-label {
        font-size: 9px;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        color: #5f5f68;
        margin-bottom: 7px;
      }
      #controls .row { display: flex; flex-wrap: wrap; gap: 5px; }
      #controls button {
        flex: 1 1 auto;
        min-width: 0;
        font-family: inherit;
        font-size: 10.5px;
        letter-spacing: 0.05em;
        color: #a9a9b2;
        background: #1b1b1f;
        border: 1px solid #2c2c33;
        border-radius: 3px;
        padding: 6px 7px;
        cursor: pointer;
        transition: background 0.13s ease, color 0.13s ease, border-color 0.13s ease;
      }
      #controls button:hover { background: #242429; color: #e6e6ea; }
      #controls button[aria-pressed="true"] {
        background: #2f1c14;
        border-color: #6a3620;
        color: #ff8054;
      }
      #controls .views button { flex: 1 1 30%; }
      #controls .readout {
        margin-top: 12px;
        padding-top: 10px;
        border-top: 1px solid #242429;
        font-size: 9.5px;
        line-height: 1.6;
        letter-spacing: 0.04em;
        color: #5f5f68;
      }
      #controls .readout b { color: #9a9aa3; font-weight: 400; }

      /* ----------------------------------------------------------- shot mode */

      body.shot {
        overflow: hidden;
        background: transparent;
      }
      body.shot #detail,
      body.shot #controls { display: none !important; }
      body.shot #stage {
        position: absolute;
        inset: 0 auto auto 0;
        width: auto;
        height: auto;
      }
      body.shot #stage canvas { width: auto; height: auto; }

      /* ------------------------------------------------------------ narrow */

      /*
         The panel is a fixed pixel width, so on a narrow window it eats the
         viewport rather than shrinking with it. Step it down, then stop
         competing altogether and stack: below 820px the 3D view takes the top
         of the page at a fixed height and the detail text scrolls underneath,
         which keeps the canvas usable instead of squeezing it to a sliver.
      */
      @media (max-width: 1180px) { :root { --panel-w: 400px; } }
      @media (max-width: 1000px) { :root { --panel-w: 340px; } }

      @media (max-width: 820px) {
        html, body { overflow: auto; }
        #app { display: flex; flex-direction: column; min-height: 100%; }

        #stage {
          position: sticky;
          inset: auto;
          top: 0;
          order: 1;
          width: 100%;
          /* flex-shrink would collapse this to min-height behind the panel. */
          flex: 0 0 62vh;
          height: 62vh;
          min-height: 320px;
          border-bottom: 1px solid var(--line);
        }

        #detail {
          position: static;
          order: 2;
          width: 100%;
          max-width: 640px;
          margin: 0 auto;
          overflow: visible;
          border-right: 0;
          padding: 24px 20px 48px;
        }

        #controls {
          right: 10px;
          bottom: auto;
          top: calc(62vh - 10px);
          transform: translateY(-100%);
          width: 200px;
          padding: 10px 11px 11px;
        }
        #controls .readout { display: none; }
      }

      @media (max-width: 420px) {
        #controls { width: 168px; }
        #controls button { font-size: 9.5px; padding: 5px 4px; }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <aside id="detail"></aside>
      <div id="stage"></div>
    </div>
    <script type="module" src="/src/viewer/main.ts"></script>
  </body>
</html>
